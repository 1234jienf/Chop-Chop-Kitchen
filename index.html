<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#17130f" />
    <title>Chop-Chop-Kitchen</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">3인 협동 쿠킹 데모</p>
          <h1>Chop-Chop-Kitchen</h1>
        </div>
        <div class="header-stats" aria-label="식당 현황">
          <span class="chip">DAY <strong id="dayLabel">1</strong></span>
          <span class="chip">자금 <strong id="moneyLabel">0</strong>G</span>
          <span class="chip">식당 <strong id="gradeLabel">1성</strong></span>
        </div>
      </header>

      <main class="layout">
        <section class="panel briefing">
          <div class="section-heading"><span>01</span><h2>오늘의 주문</h2></div>
          <div id="guestCard" class="guest-card"></div>
          <label class="field">데모 메뉴
            <select id="menuSelect"></select>
          </label>
          <div id="courseList" class="course-list"></div>
        </section>

        <section class="panel kitchen">
          <div class="section-heading"><span>02</span><h2>릴레이 키친</h2></div>
          <div class="counter-scene" aria-label="1인칭 조리대 임시 화면">
            <div class="station-icon" id="stationIcon">🔪</div>
            <p class="station-label" id="stationLabel">조리 준비 중</p>
            <div class="hands"><span>🫲</span><span>🫱</span></div>
          </div>
          <div class="now-playing">
            <p id="playerLabel" class="player-label"></p>
            <h3 id="stepTitle"></h3>
            <p id="stepHint" class="muted"></p>
          </div>
          <div class="meter" aria-label="마이크 입력 세기"><div id="voiceBar"></div></div>
          <p id="micStatus" class="mic-status">마이크를 켜거나 테스트 입력을 사용하세요.</p>
          <div class="actions">
            <button id="micBtn" class="secondary">마이크 켜기</button>
            <button id="successBtn">성공 입력</button>
            <button id="missBtn" class="danger">실수 입력</button>
          </div>
        </section>

        <section class="panel progress-panel">
          <div class="section-heading"><span>03</span><h2>오늘의 진행</h2></div>
          <div id="timeline" class="timeline"></div>
        </section>

        <section class="panel result-panel">
          <div class="section-heading"><span>04</span><h2>리뷰 & 정산</h2></div>
          <div id="reviewPanel" class="review empty">12개 공정을 마치면 리뷰가 나타납니다.</div>
          <button id="nextDayBtn" hidden>정산하고 다음 날</button>
        </section>
      </main>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
